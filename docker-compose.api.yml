# The API as a container, published at hh.qitmir.uz through the tunnel.
#
#   pnpm api:up        docker compose -f docker-compose.api.yml up -d --build
#   pnpm api:logs
#   pnpm api:down
#
# A third file rather than a service in docker-compose.dev.yml, for the same reason
# the tunnel has its own: the database is always wanted locally, whereas *running*
# the API in Docker is a choice. `pnpm start:dev` on the host stays the inner loop -
# Nest's watch mode is much faster than an image rebuild - and this file is how the
# same code gets deployed.
#
# All three files sit in one directory, so Compose gives them one project name and
# therefore one network (`headhunter-backend_default`). That is what lets this
# service reach `postgres` and lets cloudflared reach `api`, with no network block
# in any of the files.
#
# Bring the database up first (`pnpm db:up`): there is deliberately no `depends_on`,
# because it cannot refer to a service defined in another file. A late database is
# survivable anyway - the pool fails fast and /health reports `degraded` until it
# answers.
services:
  api:
    build:
      context: .
      # Named so a rebuild replaces it rather than accumulating <none> images.
      target: runtime
    image: headhunter-api:local
    container_name: headhunter-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the network Postgres is a service name on its own port - the host's
      # 5435 mapping does not exist here. These override .env, which is written for
      # a process running on the host.
      DB_HOST: postgres
      DB_PORT: 5432
      # JSON logs. `pino-pretty` is a devDependency and this image carries
      # production dependencies only, so pretty printing would crash at boot - see
      # LOG_PRETTY in src/infra/env-schema.ts.
      LOG_PRETTY: 'false'
      # Behind Cloudflare the caller's address is this header and not
      # X-Forwarded-For, whose order Express reads backwards (MEMORY.md). Repeated
      # here so per-IP rate limiting still works if .env is ever missing it.
      CLIENT_IP_HEADER: cf-connecting-ip
    ports:
      # Bound to loopback on purpose. The tunnel reaches this container over the
      # Docker network by name, so nothing needs to be reachable from the LAN; the
      # mapping exists only so a developer can curl 127.0.0.1:3001 and Swagger.
      - '127.0.0.1:3001:3001'
    init: true
