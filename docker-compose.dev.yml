# Local development database only. The API itself runs on the host via
# `pnpm start:dev` so Nest's watch mode stays fast.
services:
  postgres:
    image: postgres:18-alpine
    container_name: headhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: headhunter
      POSTGRES_USER: headhunter
      POSTGRES_PASSWORD: local_dev_password
    ports:
      # Host port 5435, not 5432: this machine already runs Postgres for other
      # projects (sahih-db on 5433, kirill-lotin-bot on 5434). Staying off the
      # default port keeps headhunter from colliding with them.
      - '5435:5432'
    volumes:
      # Postgres 18+ images store data in a major-version-specific subdirectory
      # and require the mount at /var/lib/postgresql, NOT /var/lib/postgresql/data.
      # Mounting the old path makes the container refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U headhunter -d headhunter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
