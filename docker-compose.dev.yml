# Local development database only. The API itself runs on the host via
# `pnpm start:dev` so Nest's watch mode stays fast.
services:
  postgres:
    image: postgres:18-alpine
    container_name: headhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: headhunter
      POSTGRES_USER: headhunter
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U headhunter -d headhunter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
