# Cloudflare tunnel for hh.qitmir.uz
#
# Tunnel `headhunter` (id below) was created 2026-08-05. cert.pem is deliberately NOT
# here: a tunnel only needs its credentials JSON to *run*. Management commands
# (create / delete / route dns) need the account-level cert, which stays where it
# already lived rather than being copied into a third directory.
#
# Same shape as the sahih-bot and kirill-lotin-bot tunnels: a named tunnel with its
# credentials JSON beside this file. Create both with the commands in
# docs/DEPLOYMENT.md - `cloudflared tunnel create` writes the JSON and prints the id
# that goes below.
#
# The origin is the `api` service by name, over the Docker network the three compose
# files share (they sit in one directory, so Compose gives them one project and one
# default network). Changed 2026-08-05 when the API was containerised.
#
# It was `host.docker.internal:3001` while the API ran on the host. Worth knowing why
# that is not merely equivalent: the container publishes its port to **loopback
# only**, and while Docker Desktop's port proxy happens to make that reachable from
# `host.docker.internal`, a Linux host would not - the API would be unreachable there
# with no clue as to why. Addressing the service directly also removes the host from
# the path entirely, so nothing needs to be published for the tunnel to work at all.
#
# Why a tunnel and not a port forward: the origin is never publicly reachable. There
# is no inbound port to firewall, no origin certificate to manage, and nothing to
# scan - cloudflared holds an outbound connection to Cloudflare instead.

tunnel: 3d0cec91-0f40-4f1d-848a-76c4c952142b
credentials-file: /home/nonroot/.cloudflared/3d0cec91-0f40-4f1d-848a-76c4c952142b.json

ingress:
  - hostname: hh.qitmir.uz
    service: http://api:3001
    originRequest:
      # The API answers /health in well under a second; a long timeout here only
      # delays the failure when the origin is down.
      connectTimeout: 10s
      # File uploads and downloads are proxied through this API (a CV is up to
      # 10 MB), so the default 30s read timeout is too tight on a slow handset.
      tcpKeepAlive: 30s
      noHappyEyeballs: true

  # Anything else addressed at this tunnel is refused rather than falling through to
  # the API - a tunnel with a catch-all origin serves every hostname anyone points
  # at it.
  - service: http_status:404
